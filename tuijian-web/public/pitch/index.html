/* ===== 渲染 ===== */
const deck = document.getElementById('deck');
deck.innerHTML = slides.join('');
const nodes = [...deck.querySelectorAll('.slide')];
let cur = 0;

function bgFor(n){
  if (n.classList.contains('halves')) return 'linear-gradient(90deg,#ffffff 0 50%,#1b2129 50% 100%)';
  if (n.classList.contains('dark')) return '#14171b';
  return '#f4f5f7';
}
function fit(){
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  deck.style.transform = `translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize', fit);

function show(i){
  cur = Math.max(0, Math.min(nodes.length - 1, i));
  nodes.forEach((n, k) => n.classList.toggle('on', k === cur));
  document.body.style.background = bgFor(nodes[cur]);
  document.getElementById('bar').style.width = ((cur + 1) / nodes.length * 100) + '%';
  document.getElementById('pno').textContent = `${cur + 1} / ${nodes.length}`;
  history.replaceState(null, '', '#' + (cur + 1));
}
document.addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)) { e.preventDefault(); show(cur + 1); }
  else if (['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)) { e.preventDefault(); show(cur - 1); }
  else if (k === 'Home') show(0);
  else if (k === 'End') show(nodes.length - 1);
  else if (k.toLowerCase() === 'f') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});
document.addEventListener('click', e => {
  if (e.detail === 0) return;
  (e.clientX < window.innerWidth * 0.22) ? show(cur - 1) : show(cur + 1);
});

fit();
show(parseInt(location.hash.slice(1), 10) > 0 ? parseInt(location.hash.slice(1), 10) - 1 : 0);

if (location.search.includes('measure')) {
  const out = [];
  const deckR = deck.getBoundingClientRect();
  out.push(`deck scale w=${deckR.width.toFixed(1)} h=${deckR.height.toFixed(1)}`);
  const mi = parseInt((location.search.match(/measure=(\d+)/)||[])[1]||1,10);
  const s1 = nodes[mi-1];
  s1.classList.add('on');
  const sr = s1.getBoundingClientRect();
  out.push(`slide${mi} w=${sr.width.toFixed(1)} h=${sr.height.toFixed(1)}`);
  [...s1.querySelectorAll('*')].forEach(el => {
    if (el.closest('.glow,.dots')) return;
    const r = el.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const t = (el.textContent || '').trim().slice(0, 14) || el.className;
    out.push(`  ${el.className || el.tagName} "${t}" x=${(r.left-sr.left).toFixed(0)} y=${(r.top-sr.top).toFixed(0)} w=${r.width.toFixed(0)} h=${r.height.toFixed(0)} bottom=${(r.bottom-sr.top).toFixed(0)}`);
  });
  s1.classList.remove('on');
  const pre = document.createElement('pre'); pre.id='measure'; pre.textContent = out.join('\n');
  document.body.appendChild(pre);
}
/* ===== 自检：出血 / 溢出 / 重叠 ===== */
if (location.search.includes('audit')) {
  const issues = [], rects = [];
  nodes.forEach((n, i) => {
    n.classList.add('on');
    const P = n.getBoundingClientRect();
    n.querySelectorAll('*').forEach(el => {
      if (el.children.length) return;
      if (el.closest('.glow,.dots,.wm')) return;
      const r = el.getBoundingClientRect();
      if (!r.width || !r.height) return;
      const t = (el.textContent || '').trim().slice(0, 16) || el.className;
      if (r.right > P.right + 2 || r.bottom > P.bottom + 2 || r.left < P.left - 2) issues.push(`p${i+1} 出血 ${t}`);
      const cs = getComputedStyle(el);
      if (el.clientWidth > 0 && cs.display !== 'inline' && cs.overflow !== 'visible' &&
          (el.scrollWidth > el.clientWidth + Math.max(3, el.clientWidth * .1) ||
           el.scrollHeight > el.clientHeight + Math.max(3, el.clientHeight * .1))) issues.push(`p${i+1} 溢出 ${t}`);
      if (t) rects.push({ p: i + 1, el, r, t });
    });
    if (i !== cur) n.classList.remove('on');
  });
  for (let a = 0; a < rects.length; a++) for (let b = a + 1; b < rects.length; b++) {
    const A = rects[a], B = rects[b];
    if (A.p !== B.p || A.el.contains(B.el) || B.el.contains(A.el)) continue;
    const ox = Math.min(A.r.right, B.r.right) - Math.max(A.r.left, B.r.left);
    const oy = Math.min(A.r.bottom, B.r.bottom) - Math.max(A.r.top, B.r.top);
    if (ox > 6 && oy > 6) issues.push(`p${A.p} 重叠 "${A.t}" × "${B.t}"`);
  }
  const pre = document.createElement('pre');
  pre.id = 'audit';
  pre.textContent = 'START\n' + (issues.length ? [...new Set(issues)].join('\n') : 'OK 无出血 无溢出 无重叠') + '\nEND';
  document.body.appendChild(pre);
}
</script>
</body>
</html>
